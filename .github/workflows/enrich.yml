name: OpenAlex enrichment
on:
  workflow_dispatch:
    inputs:
      country:
        description: "Country code (folder under countries/), e.g. cl"
        required: true
        default: "cl"
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/enrich_openalex.py ${{ github.event.inputs.country }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add countries/${{ github.event.inputs.country }}/openalex_works.json countries/${{ github.event.inputs.country }}/openalex_institutions.json
          git commit -m "OpenAlex enrichment (${{ github.event.inputs.country }})" || echo "nothing to commit"
          git pull --rebase
          git push
